name: Verify WARDLINE INDIA

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      upload_pages:
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Acquire and reconcile verified inputs
        run: |
          python -m pipeline acquire
          python -m pipeline all
          python -m unittest discover -s tests -v
          python scripts/verify_research.py
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 24.12.0
          package-manager-cache: false
      - name: Install from the npm lockfile
        run: npm --prefix frontend ci --no-audit --no-fund
      - name: Assemble and validate production assets
        run: |
          python scripts/prepare_site.py
          npm --prefix frontend run build
          npm --prefix frontend run verify:logic
          node --test frontend/scripts/runtime_bundle.test.mjs frontend/scripts/public_text.test.mjs
        env:
          VITE_PUBLIC_REPOSITORY_URL: ${{ inputs.upload_pages && format('{0}/{1}', github.server_url, github.repository) || '' }}
      - run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Verify the production site at its project path
        run: |
          node frontend/scripts/pages_acceptance.mjs assets
          node frontend/scripts/handbook_acceptance.mjs
      - name: Configure Pages
        if: inputs.upload_pages && github.ref == 'refs/heads/main' && vars.WARDLINE_PAGES_APPROVED == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Send the verified output to Pages
        if: inputs.upload_pages && github.ref == 'refs/heads/main' && vars.WARDLINE_PAGES_APPROVED == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: frontend/dist
